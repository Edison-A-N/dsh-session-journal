# Publishes the package to npm when a version tag (v1.2.3) is pushed.
# Authentication uses npm trusted publishing (OIDC): no npm token is stored.
# The package's trusted publisher on npmjs.com must name this repository and
# the workflow file "publish.yml".
name: Publish to npm

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Check that the committed client bundle is up to date
        run: |
          pnpm run build
          git diff --exit-code -- lib

      - run: pnpm test

      - run: npm publish --provenance --access public
